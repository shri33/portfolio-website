<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="mesheryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B39F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D3A9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mesheryGrad)"/>
  
  <!-- Cloud Native Icon -->
  <g transform="translate(400, 200)">
    <!-- Server/Container blocks -->
    <rect x="-80" y="-40" width="50" height="50" fill="white" opacity="0.9" rx="5"/>
    <rect x="-15" y="-40" width="50" height="50" fill="white" opacity="0.9" rx="5"/>
    <rect x="30" y="-40" width="50" height="50" fill="white" opacity="0.9" rx="5"/>
    
    <rect x="-80" y="20" width="50" height="50" fill="white" opacity="0.7" rx="5"/>
    <rect x="-15" y="20" width="50" height="50" fill="white" opacity="0.7" rx="5"/>
    <rect x="30" y="20" width="50" height="50" fill="white" opacity="0.7" rx="5"/>
    
    <!-- Connecting lines -->
    <line x1="-55" y1="15" x2="-55" y2="20" stroke="white" stroke-width="2" opacity="0.8"/>
    <line x1="10" y1="15" x2="10" y2="20" stroke="white" stroke-width="2" opacity="0.8"/>
    <line x1="55" y1="15" x2="55" y2="20" stroke="white" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Kubernetes helm icon suggestion -->
  <circle cx="400" cy="450" r="30" fill="white" opacity="0.3"/>
  <polygon points="400,425 415,445 385,445" fill="white" opacity="0.8"/>
  
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Meshery</text>
  <text x="400" y="555" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.9">Cloud Native Manager</text>
</svg>
