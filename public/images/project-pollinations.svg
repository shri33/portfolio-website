<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="pollinationsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pollinationsGrad)"/>
  
  <!-- AI Brain/Network -->
  <g transform="translate(400, 250)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="25" fill="white" opacity="0.9"/>
    
    <!-- Surrounding nodes -->
    <circle cx="-80" cy="-60" r="18" fill="white" opacity="0.8"/>
    <circle cx="80" cy="-60" r="18" fill="white" opacity="0.8"/>
    <circle cx="-100" cy="40" r="18" fill="white" opacity="0.8"/>
    <circle cx="100" cy="40" r="18" fill="white" opacity="0.8"/>
    <circle cx="0" cy="90" r="18" fill="white" opacity="0.8"/>
    <circle cx="0" cy="-100" r="18" fill="white" opacity="0.8"/>
    
    <!-- Connections -->
    <line x1="0" y1="0" x2="-80" y2="-60" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="80" y2="-60" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="-100" y2="40" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="100" y2="40" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="90" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-100" stroke="white" stroke-width="2" opacity="0.6"/>
    
    <!-- Sparkles for generative AI -->
    <polygon points="130,-20 135,-10 145,-10 137,0 140,10 130,5 120,10 123,0 115,-10 125,-10" fill="white" opacity="0.9"/>
    <polygon points="-130,60 -125,70 -115,70 -123,80 -120,90 -130,85 -140,90 -137,80 -145,70 -135,70" fill="white" opacity="0.9"/>
  </g>
  
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">Pollinations</text>
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.9">Generative AI Platform</text>
</svg>
