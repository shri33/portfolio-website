<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="tourpinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#tourpinGrad)"/>
  
  <!-- Map pin icon -->
  <g transform="translate(400, 220)">
    <path d="M 0,-80 C -30,-80 -55,-55 -55,-25 C -55,10 0,80 0,80 C 0,80 55,10 55,-25 C 55,-55 30,-80 0,-80 Z" 
          fill="white" opacity="0.9"/>
    <circle cx="0" cy="-25" r="20" fill="#0EA5E9"/>
  </g>
  
  <!-- Travel route line -->
  <path d="M 150,450 Q 300,380 400,420 T 650,450" 
        stroke="white" 
        stroke-width="4" 
        stroke-dasharray="10,10" 
        fill="none" 
        opacity="0.6"/>
  
  <!-- Location markers -->
  <circle cx="150" cy="450" r="8" fill="white" opacity="0.8"/>
  <circle cx="400" cy="420" r="8" fill="white" opacity="0.8"/>
  <circle cx="650" cy="450" r="8" fill="white" opacity="0.8"/>
  
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">TourPin</text>
  <text x="400" y="555" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.9">Travel Platform</text>
</svg>
